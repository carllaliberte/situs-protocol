openapi: 3.1.0
info:
  title: SITUS Connect
  version: "0.2.0"
  description: |
    Prise de droits spatiaux + tour Ollama local.
    Pas d'hébergeur SITUS. Ollama reste 127.0.0.1.
servers:
  - url: http://127.0.0.1:8765/v0
    description: Nœud local QUANTUM
paths:
  /autoriser:
    post:
      operationId: autoriser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoriserIn" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoriserOut" }
  /parler:
    post:
      summary: Autoriser puis agent + juge Ollama (local)
      operationId: parler
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParlerIn" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParlerOut" }
  /verifier:
    post:
      operationId: verifier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifierIn" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifierOut" }
  /licence/{empreinte}:
    get:
      operationId: licence
      parameters:
        - name: empreinte
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenceOut" }
        "404": { description: Inconnue }
components:
  schemas:
    AutoriserIn:
      type: object
      required: [empreinte, usage]
      additionalProperties: false
      properties:
        empreinte: { type: string, pattern: "^[0-9a-f]{64}$" }
        usage: { type: string, enum: [capture, train, sim, deploy] }
        message: { type: string }
    AutoriserOut:
      type: object
      required: [decision, usage, empreinte]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [allow, deny, urgent] }
        usage: { type: string }
        empreinte: { type: string }
        flags: { type: array, items: { type: string } }
        revoque: { type: boolean }
    ParlerIn:
      type: object
      required: [empreinte, usage, message]
      additionalProperties: false
      properties:
        empreinte: { type: string, pattern: "^[0-9a-f]{64}$" }
        usage: { type: string, enum: [capture, train, sim, deploy] }
        message: { type: string }
    ParlerOut:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [allow, deny, urgent] }
        agent: { type: object }
        juge: { type: object }
        score_juge: { type: string, nullable: true }
        session_ferme: { type: boolean }
    VerifierIn:
      type: object
      required: [empreinte, scan_sha256]
      additionalProperties: false
      properties:
        empreinte: { type: string }
        scan_sha256: { type: string }
        inventaire_sha256: { type: string }
    VerifierOut:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        raison: { type: string }
    LicenceOut:
      type: object
      required: [empreinte, usages, revoque]
      additionalProperties: false
      properties:
        empreinte: { type: string }
        usages: { type: array, items: { type: string } }
        revoque: { type: boolean }
        revoque_at: { type: string, nullable: true }
        inventaire_sha256: { type: string }
