name: gitops

on:
  push:
    branches: [main]
    paths:
      - "connect/**"
      - "schema/**"
      - "examples/**"
      - ".github/workflows/**"
      - "GITOPS.md"
      - "CONNECT.md"
      - "ANNUAIRE.md"
      - "QUITTANCE.md"
      - "DOUANE.md"
      - "OLLAMA.md"
  pull_request:
    paths:
      - "connect/**"
      - "schema/**"
      - "examples/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reconcilier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: état désiré
        run: |
          set -e
          test -f connect/openapi.v0.yaml
          test -f CONNECT.md
          test -f schema/quittance.v0.json
          test -f schema/douane.v0.json
          test -f schema/entree.v0.json
      - name: JSON parse
        run: |
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path("examples").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          for p in pathlib.Path("schema").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          PY
      - name: aucun apply cluster
        run: echo "GitOps SITUS = proto. SHA=${{ github.sha }}"
