name: filtre

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: filtre-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: pytest portes + filtre
        run: |
          set -e
          python3 -m pip install --user pytest
          PYTHONPATH=src python3 -m pytest tests/ -q
