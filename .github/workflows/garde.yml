name: garde

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: garde-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: aucun lieu réel dans le proto
        run: |
          set -e
          if git ls-files | grep -Ei '\.(spz|ply)$|(^|/)owner\.txt$|(^|/)quantum\.db$'; then
            echo "fichier interdit versionné"
            exit 1
          fi
      - name: Discord si échec
        if: failure()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          test -n "$HOOK" || exit 0
          curl -sS -o /dev/null -H "Content-Type: application/json" \
            -d "{\"content\":\"SITUS garde ÉCHEC — ${{ github.repository }} ${{ github.sha }}\"}" \
            "$HOOK"
      - name: Slack si échec
        if: failure()
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          test -n "$HOOK" || exit 0
          curl -sS -o /dev/null -H "Content-Type: application/json" \
            -d "{\"text\":\"SITUS garde ÉCHEC — ${{ github.repository }} ${{ github.sha }}\"}" \
            "$HOOK"
